<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">Four test groups, not four environments</title>
  <desc id="description">Development asks whether it is built right, accurate, fast and stable enough, and runs locally, in CI, dev and tst, with performance in acc. Governance asks whether declared security, legal and control requirements are met, and runs in acc with post-market monitoring in prd. Business asks whether deployment consequences are known, and runs in acc. Production asks whether it holds with real infrastructure and users, and runs in prd.</desc>
  <defs>
    <clipPath id="card"><rect width="355" height="420" rx="20"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 1.6px; }
      .name { font-size: 38px; font-weight: 700; }
      .q { font-size: 25px; font-weight: 600; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; font-weight: 600; }
      .banner { font-size: 27px; font-weight: 650; }
      .small { font-size: 21px; fill: #526176; }
    </style>
  </defs>

  <rect width="1600" height="640" rx="28" fill="#f8fafc"/>

  <g transform="translate(51,40)">
    <rect width="355" height="420" rx="20" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="355" height="12" fill="#3b82f6" clip-path="url(#card)"/>
    <text class="eyebrow" x="28" y="58" style="fill:#2563eb">GROUP</text>
    <text class="name" x="28" y="104" style="fill:#1d4ed8">Development</text>
    <text class="q" x="28" y="160">Built right, accurate,</text>
    <text class="q" x="28" y="192">fast and stable enough?</text>
    <path d="M28 262H327" stroke="#e2e8f0" stroke-width="2"/>
    <text class="label" x="28" y="300">RUNS IN</text>
    <rect x="28" y="316" width="84" height="40" rx="10" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="chip" x="70" y="343" text-anchor="middle" style="fill:#1d4ed8">Local</text>
    <rect x="122" y="316" width="48" height="40" rx="10" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="chip" x="146" y="343" text-anchor="middle" style="fill:#1d4ed8">CI</text>
    <rect x="180" y="316" width="60" height="40" rx="10" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="chip" x="210" y="343" text-anchor="middle" style="fill:#1d4ed8">dev</text>
    <rect x="250" y="316" width="60" height="40" rx="10" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="chip" x="280" y="343" text-anchor="middle" style="fill:#1d4ed8">tst</text>
    <rect x="28" y="366" width="144" height="40" rx="10" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="chip" x="100" y="393" text-anchor="middle" style="fill:#1d4ed8">acc · perf</text>
  </g>

  <g transform="translate(432,40)">
    <rect width="355" height="420" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
    <rect width="355" height="12" fill="#8b5cf6" clip-path="url(#card)"/>
    <text class="eyebrow" x="28" y="58" style="fill:#7c3aed">GROUP</text>
    <text class="name" x="28" y="104" style="fill:#6d28d9">Governance</text>
    <text class="q" x="28" y="160">Declared security,</text>
    <text class="q" x="28" y="192">legal and control</text>
    <text class="q" x="28" y="224">requirements met?</text>
    <path d="M28 262H327" stroke="#e2e8f0" stroke-width="2"/>
    <text class="label" x="28" y="300">RUNS IN</text>
    <rect x="28" y="316" width="60" height="40" rx="10" fill="#f3edff" stroke="#c4b5fd" stroke-width="2"/>
    <text class="chip" x="58" y="343" text-anchor="middle" style="fill:#6d28d9">acc</text>
    <rect x="98" y="316" width="216" height="40" rx="10" fill="#f3edff" stroke="#c4b5fd" stroke-width="2"/>
    <text class="chip" x="206" y="343" text-anchor="middle" style="fill:#6d28d9">prd · monitoring</text>
  </g>

  <g transform="translate(813,40)">
    <rect width="355" height="420" rx="20" fill="#fff" stroke="#fde68a" stroke-width="2"/>
    <rect width="355" height="12" fill="#f59e0b" clip-path="url(#card)"/>
    <text class="eyebrow" x="28" y="58" style="fill:#d97706">GROUP</text>
    <text class="name" x="28" y="104" style="fill:#b45309">Business</text>
    <text class="q" x="28" y="160">Deployment</text>
    <text class="q" x="28" y="192">consequences known?</text>
    <path d="M28 262H327" stroke="#e2e8f0" stroke-width="2"/>
    <text class="label" x="28" y="300">RUNS IN</text>
    <rect x="28" y="316" width="60" height="40" rx="10" fill="#fff7e6" stroke="#fcd34d" stroke-width="2"/>
    <text class="chip" x="58" y="343" text-anchor="middle" style="fill:#b45309">acc</text>
  </g>

  <g transform="translate(1194,40)">
    <rect width="355" height="420" rx="20" fill="#fff" stroke="#fecaca" stroke-width="2"/>
    <rect width="355" height="12" fill="#dc2626" clip-path="url(#card)"/>
    <text class="eyebrow" x="28" y="58" style="fill:#b91c1c">GROUP</text>
    <text class="name" x="28" y="104" style="fill:#991b1b">Production</text>
    <text class="q" x="28" y="160">Holds with real</text>
    <text class="q" x="28" y="192">infrastructure</text>
    <text class="q" x="28" y="224">and users?</text>
    <path d="M28 262H327" stroke="#e2e8f0" stroke-width="2"/>
    <text class="label" x="28" y="300">RUNS IN</text>
    <rect x="28" y="316" width="60" height="40" rx="10" fill="#fdecec" stroke="#f0a3a3" stroke-width="2"/>
    <text class="chip" x="58" y="343" text-anchor="middle" style="fill:#991b1b">prd</text>
  </g>

  <rect x="51" y="494" width="1498" height="112" rx="18" fill="#eef2f7"/>
  <text class="banner" x="800" y="541" text-anchor="middle">Groups say why a check exists. Environments say where it runs.</text>
  <text class="small" x="800" y="577" text-anchor="middle">Write group names in full: group Development, not dev.</text>
</svg>
