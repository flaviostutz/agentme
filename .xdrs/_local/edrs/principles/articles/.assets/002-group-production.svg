<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="816" viewBox="0 0 1600 816" role="img" aria-labelledby="title description">
  <title id="title">group Production profile</title>
  <desc id="description">Objective: works with real infrastructure and users. Risk if skipped: customer harm, outage and lost trust. Runs in prd. People: DevOps runs; Product Owner and Tech Lead decide. Data: real, with controlled audiences. Timing: planned alpha, beta and GA windows. Evidence: rollout records and monitoring. Main test types: Deployment verification, Live outcome validation, Production reliability.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0 0L12 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="data" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M3 22c0-5.5 4-8.5 9-8.5s9 3 9 8.5z"/></symbol>
    <symbol id="doc" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5z"/><path d="M14 2v5h5" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M8 12h8M8 16h8" stroke="#fff" stroke-width="1.8"/></symbol>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .chip { font-size: 21px; font-weight: 650; }
      .cap { font-size: 24px; font-weight: 700; }
      .sub { font-size: 19px; fill: #526176; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 22px; font-weight: 650; }
      .note { font-size: 23px; font-weight: 650; }
      .tile { fill: #fff; stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="816" rx="28" fill="#f8fafc"/>

  <rect x="40" y="40" width="440" height="570" rx="28" fill="#991b1b"/>
  <text x="72" y="96" style="fill:#fff;opacity:.75;font-size:17px;font-weight:700;letter-spacing:1.4px">GROUP</text>
  <text x="72" y="160" style="fill:#fff;font-size:54px;font-weight:700">Production</text>
  <text x="72" y="236" style="fill:#fff;opacity:.75;font-size:17px;font-weight:700;letter-spacing:1.4px">OBJECTIVE</text>
  <text x="72" y="284" style="fill:#fff;font-size:34px;font-weight:700">Works with real</text>
  <text x="72" y="328" style="fill:#fff;font-size:34px;font-weight:700">infrastructure</text>
  <text x="72" y="372" style="fill:#fff;font-size:34px;font-weight:700">and users</text>
  <g transform="translate(0,-70)">
  <rect x="64" y="500" width="392" height="156" rx="20" style="fill:#fff;opacity:.15"/>
  <path d="M88 548L102 522L116 548Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M102 531V539M102 543V544" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="544" style="fill:#fff;opacity:.85;font-size:17px;font-weight:700;letter-spacing:1.4px">RISK IF SKIPPED</text>
  <text x="88" y="594" style="fill:#fff;font-size:28px;font-weight:700">Customer harm, outage,</text>
  <text x="88" y="630" style="fill:#fff;font-size:28px;font-weight:700">lost trust</text>
  </g>

  <rect class="tile" x="520" y="40" width="1040" height="130" rx="18"/>
  <text class="eyebrow" x="540" y="76">WHERE IT RUNS</text>
  <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M770 119H794"/>
    <path d="M1028 119H1052"/>
    <path d="M1286 119H1310"/>
  </g>
  <rect x="540" y="92" width="225" height="54" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <text class="mono" x="652" y="127" text-anchor="middle" style="fill:#94a3b8">Local · CI</text>
  <rect x="798" y="92" width="225" height="54" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <text class="mono" x="910" y="127" text-anchor="middle" style="fill:#94a3b8">dev · tst</text>
  <rect x="1056" y="92" width="225" height="54" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <text class="mono" x="1168" y="127" text-anchor="middle" style="fill:#94a3b8">acc</text>
  <rect x="1314" y="92" width="225" height="54" rx="14" fill="#fdecec" stroke="#f0a3a3" stroke-width="2.5"/>
  <text class="mono" x="1426" y="127" text-anchor="middle" style="fill:#991b1b">prd</text>

  <g transform="translate(520,190)">
    <rect class="tile" width="510" height="200" rx="18"/>
    <text class="eyebrow" x="24" y="40">WHO</text>
    <rect x="24" y="64" width="132" height="44" rx="22" fill="#fdecec" stroke="#f0a3a3" stroke-width="2"/>
    <use href="#person" x="38" y="73" width="26" height="26" fill="#991b1b"/>
    <text class="chip" x="72" y="93" style="fill:#991b1b">DevOps</text>
    <text class="sub" x="170" y="93" style="font-style:italic;font-size:18px">runs</text>
    <rect x="24" y="124" width="214" height="44" rx="22" fill="#991b1b"/>
    <use href="#person" x="38" y="133" width="26" height="26" fill="#fff"/>
    <text class="chip" x="72" y="153" style="fill:#fff">Product Owner</text>
    <rect x="248" y="124" width="167" height="44" rx="22" fill="#991b1b"/>
    <use href="#person" x="262" y="133" width="26" height="26" fill="#fff"/>
    <text class="chip" x="296" y="153" style="fill:#fff">Tech Lead</text>
    <text class="sub" x="427" y="153" style="font-style:italic;font-size:18px">decide</text>
  </g>

  <g transform="translate(1050,190)">
    <rect class="tile" width="510" height="200" rx="18"/>
    <text class="eyebrow" x="24" y="40">DATA</text>
    <rect x="24" y="78" width="462" height="14" rx="7" fill="url(#data)"/>
    <circle cx="468" cy="85" r="15" fill="#fff" stroke="#991b1b" stroke-width="5"/>
    <text class="sub" x="24" y="124">Synthetic</text>
    <text class="sub" x="255" y="124" text-anchor="middle">Production-like</text>
    <text class="sub" x="486" y="124" text-anchor="end">Real</text>
    <text class="cap" x="24" y="160">Real data</text>
    <text class="sub" x="24" y="186">Controlled audiences</text>
  </g>

  <g transform="translate(520,410)">
    <rect class="tile" width="510" height="200" rx="18"/>
    <text class="eyebrow" x="24" y="40">WHEN</text>
    <rect x="24" y="114" width="150" height="36" rx="8" fill="#f0a3a3"/>
    <rect x="186" y="86" width="150" height="64" rx="8" fill="#dc2626"/>
    <rect x="348" y="58" width="138" height="92" rx="8" fill="#991b1b"/>
    <text x="99" y="139" text-anchor="middle" style="fill:#7f1d1d;font-size:20px;font-weight:700">alpha</text>
    <text x="261" y="124" text-anchor="middle" style="fill:#fff;font-size:20px;font-weight:700">beta</text>
    <text x="417" y="110" text-anchor="middle" style="fill:#fff;font-size:20px;font-weight:700">GA</text>
    <text class="cap" x="24" y="184">Planned rollout windows</text>
  </g>

  <g transform="translate(1050,410)">
    <rect class="tile" width="510" height="200" rx="18"/>
    <text class="eyebrow" x="24" y="40">EVIDENCE</text>
    <use href="#doc" x="24" y="96" width="76" height="76" fill="#991b1b" opacity=".3"/>
    <use href="#doc" x="40" y="86" width="76" height="76" fill="#991b1b" opacity=".55"/>
    <use href="#doc" x="56" y="76" width="76" height="76" fill="#991b1b"/>
    <text class="cap" x="164" y="112" style="font-size:28px">Rollout records</text>
    <text class="cap" x="164" y="148" style="font-size:28px">and monitoring</text>
  </g>

  <g transform="translate(40,640)">
    <rect class="tile" width="1520" height="136" rx="18"/>
    <text class="eyebrow" x="24" y="40">MAIN TEST TYPES</text>
    <rect x="24" y="70" width="350" height="46" rx="23" fill="#fdecec" stroke="#f0a3a3" stroke-width="2"/><text x="44" y="101" style="fill:#7f1d1d;font-size:24px;font-weight:700">Deployment verification</text>
    <rect x="388" y="70" width="350" height="46" rx="23" fill="#fdecec" stroke="#f0a3a3" stroke-width="2"/><text x="408" y="101" style="fill:#7f1d1d;font-size:24px;font-weight:700">Live outcome validation</text>
    <rect x="752" y="70" width="336" height="46" rx="23" fill="#fdecec" stroke="#f0a3a3" stroke-width="2"/><text x="772" y="101" style="fill:#7f1d1d;font-size:24px;font-weight:700">Production reliability</text>
    </g>
</svg>
