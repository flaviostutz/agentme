<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Three different questions for software and AI testing</title>
  <desc id="description">Test group describes why and where testing happens, test type describes the outcome being assessed, and test technique describes how evidence is gathered. Development regression protection and Business quality can both use suite replay.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0 0L18 7L0 14Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; }
      .question { font-size: 27px; font-weight: 700; }
      .hint { font-size: 17px; fill: #526176; }
      .column { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .node { font-size: 21px; font-weight: 650; }
      .note { font-size: 18px; font-weight: 650; }
      .small { font-size: 16px; fill: #526176; }
    </style>
  </defs>

  <rect width="1600" height="780" rx="28" fill="#f8fafc"/>

  <g>
    <rect x="70" y="38" width="440" height="170" rx="20" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="70" y="38" width="9" height="170" rx="4" fill="#3b82f6"/>
    <text class="eyebrow" x="102" y="76" fill="#2563eb">TEST GROUP</text>
    <text class="question" x="102" y="119">Why here in delivery?</text>
    <text class="hint" x="102" y="157">Context: where does the check belong?</text>

    <path d="M520 123H565" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="585" y="38" width="430" height="170" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="585" y="38" width="9" height="170" rx="4" fill="#8b5cf6"/>
    <text class="eyebrow" x="617" y="76" fill="#7c3aed">TEST TYPE</text>
    <text class="question" x="617" y="119">What outcome do we assess?</text>
    <text class="hint" x="617" y="157">Objective: what evidence is needed?</text>

    <path d="M1025 123H1070" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1090" y="38" width="440" height="170" rx="20" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="1090" y="38" width="9" height="170" rx="4" fill="#22a06b"/>
    <text class="eyebrow" x="1122" y="76" fill="#16804a">TEST TECHNIQUE</text>
    <text class="question" x="1122" y="119">How do we gather evidence?</text>
    <text class="hint" x="1122" y="157">Method: what check produces it?</text>
  </g>

  <text class="column" x="80" y="265">EXAMPLE PATHS</text>
  <text class="column" x="205" y="310">GROUP</text>
  <text class="column" x="620" y="310">TYPE / OBJECTIVE</text>
  <text class="column" x="1192" y="310">TECHNIQUE</text>

  <g>
    <rect x="80" y="330" width="300" height="92" rx="16" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="node" x="230" y="385" text-anchor="middle" fill="#1d4ed8">Development</text>
    <path d="M390 376H560" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="580" y="330" width="380" height="92" rx="16" fill="#f3edff" stroke="#c4b5fd" stroke-width="2"/>
    <text class="node" x="770" y="385" text-anchor="middle" fill="#6d28d9">Regression protection</text>
    <path d="M970 376H1040M1040 361V407M1040 361H1090M1040 407H1090" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <path d="M1072 361H1090M1072 407H1090" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1110" y="334" width="390" height="54" rx="14" fill="#e8f7ef" stroke="#86d5ac" stroke-width="2"/>
    <text class="node" x="1305" y="369" text-anchor="middle" fill="#166534">Suite replay</text>
    <rect x="1110" y="392" width="390" height="54" rx="14" fill="#e8f7ef" stroke="#86d5ac" stroke-width="2"/>
    <text class="node" x="1305" y="427" text-anchor="middle" fill="#166534">Baseline comparison</text>
  </g>

  <g>
    <rect x="80" y="500" width="300" height="92" rx="16" fill="#eaf2ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="node" x="230" y="555" text-anchor="middle" fill="#1d4ed8">Business</text>
    <path d="M390 546H560" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="580" y="500" width="380" height="92" rx="16" fill="#f3edff" stroke="#c4b5fd" stroke-width="2"/>
    <text class="node" x="770" y="555" text-anchor="middle" fill="#6d28d9">Quality</text>
    <path d="M970 546H1040M1040 531V577M1040 531H1090M1040 577H1090" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <path d="M1072 531H1090M1072 577H1090" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1110" y="504" width="390" height="54" rx="14" fill="#e8f7ef" stroke="#86d5ac" stroke-width="2"/>
    <text class="node" x="1305" y="539" text-anchor="middle" fill="#166534">Suite replay</text>
    <rect x="1110" y="562" width="390" height="54" rx="14" fill="#e8f7ef" stroke="#86d5ac" stroke-width="2"/>
    <text class="node" x="1305" y="597" text-anchor="middle" fill="#166534">Usability tests</text>
  </g>

  <rect x="80" y="650" width="1440" height="52" rx="16" fill="#eef2f7"/>
  <text class="note" x="800" y="683" text-anchor="middle">A technique can support multiple objectives: suite replay serves both regression protection and quality.</text>
  <text class="small" x="800" y="742" text-anchor="middle">Unit / integration / E2E = test levels or scopes  ·  Alpha / beta / GA = rollout stages</text>
</svg>
