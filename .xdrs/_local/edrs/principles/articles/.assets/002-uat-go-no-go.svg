<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="title description">
  <title id="title">UAT: ultimate business go/no-go</title>
  <desc id="description">Quality evidence, operational readiness, governance results and other required evidence feed the UAT business go or no-go gate. The Product Owner decides and the Tech Lead opinion is recorded. The outcome is a go or no-go decision plus a record of results, risks, gaps and Production mitigations. Governance hard stops are never waived, UAT does not require perfect software, and nothing reaches prd before the gate, even with a flag off.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0 0L18 7L0 14Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 1.6px; }
      .node { font-size: 28px; font-weight: 700; }
      .col { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .banner { font-size: 26px; font-weight: 650; }
      .small { font-size: 22px; fill: #526176; }
    </style>
  </defs>

  <rect width="1600" height="690" rx="28" fill="#f8fafc"/>

  <text class="col" x="40" y="62">EVIDENCE IN</text>
  <text class="col" x="1160" y="62">OUTCOME</text>

  <rect x="40" y="90" width="380" height="92" rx="18" fill="#fff7e6" stroke="#fcd34d" stroke-width="2"/>
  <text class="node" x="230" y="148" text-anchor="middle" style="fill:#b45309">Quality evidence</text>

  <rect x="40" y="206" width="380" height="92" rx="18" fill="#fff7e6" stroke="#fcd34d" stroke-width="2"/>
  <text class="node" x="230" y="264" text-anchor="middle" style="fill:#b45309">Operational readiness</text>

  <rect x="40" y="322" width="380" height="92" rx="18" fill="#f3edff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="node" x="230" y="365" text-anchor="middle" style="fill:#6d28d9">Governance results</text>
  <text x="230" y="397" text-anchor="middle" style="fill:#7c3aed;font-size:19px;font-weight:600">hard stops are never waived</text>

  <rect x="40" y="438" width="380" height="92" rx="18" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/>
  <text class="node" x="230" y="496" text-anchor="middle">Other required evidence</text>

  <rect x="600" y="200" width="380" height="220" rx="24" fill="#172033"/>
  <text x="790" y="272" text-anchor="middle" style="fill:#fff;font-size:56px;font-weight:700">UAT</text>
  <text x="790" y="314" text-anchor="middle" style="fill:#e2e8f0;font-size:28px;font-weight:650">business go / no-go</text>
  <path d="M650 342H930" stroke="#475569" stroke-width="2"/>
  <text x="790" y="376" text-anchor="middle" style="fill:#cbd5e1;font-size:22px">Product Owner decides</text>
  <text x="790" y="405" text-anchor="middle" style="fill:#94a3b8;font-size:22px">Tech Lead opinion recorded</text>

  <rect x="1160" y="90" width="400" height="86" rx="18" fill="#e8f7ef" stroke="#86d5ac" stroke-width="2"/>
  <text class="node" x="1360" y="145" text-anchor="middle" style="fill:#166534">Go</text>

  <rect x="1160" y="196" width="400" height="86" rx="18" fill="#fdecef" stroke="#fda4af" stroke-width="2"/>
  <text class="node" x="1360" y="251" text-anchor="middle" style="fill:#be123c">No go</text>

  <rect x="1160" y="324" width="400" height="140" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="eyebrow" x="1360" y="362" text-anchor="middle" style="fill:#64748b">DECISION RECORD</text>
  <text x="1360" y="402" text-anchor="middle" style="font-size:25px;font-weight:650">Results, risks, gaps,</text>
  <text x="1360" y="436" text-anchor="middle" style="font-size:25px;font-weight:650">Production mitigations</text>

  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M420 136C510 136 510 245 596 245"/>
    <path d="M420 252C510 252 510 285 596 285"/>
    <path d="M420 368C510 368 510 325 596 325"/>
    <path d="M420 484C510 484 510 365 596 365"/>
    <path d="M980 270C1070 270 1070 133 1156 133"/>
    <path d="M980 295C1070 295 1070 239 1156 239"/>
    <path d="M980 350C1070 350 1070 394 1156 394"/>
  </g>

  <rect x="40" y="568" width="1520" height="96" rx="18" fill="#eef2f7"/>
  <text class="banner" x="800" y="610" text-anchor="middle">Nothing reaches prd, even with a flag off, before the gate.</text>
  <text class="small" x="800" y="644" text-anchor="middle">UAT does not require perfect software and does not waive Governance hard stops.</text>
</svg>
