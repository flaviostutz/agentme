<style>
:root{--ink:#1f2933;--mut:#52606d;--bg:#f7f5f0;--card:#fff;--line:#c9c3b3;--acc:#2f5d8a;--acc2:#e8eff6;--gray:#5f6870;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{font-size:100%}
*{box-sizing:border-box}
body{margin:0;background:#e9e6df;color:var(--ink);font:1rem/1.6 var(--font);text-align:left}
.app{max-width:920px;margin:16px auto;padding:0 12px}
.frame{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px #0002}

.frame>footer{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;color:var(--mut)}
main{padding:18px}
h1{font-size:1.9rem;line-height:1.3;margin:6px 0 12px;font-weight:600}
h2{font-size:1.4rem;line-height:1.3;margin:6px 0}
h3{font-size:1.15rem;margin:16px 0 6px}
h4{font-size:1rem;margin:10px 0 4px;color:var(--mut)}
p{margin:8px 0}
:focus-visible{outline:3px solid #1b4f8a;outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.muted{color:var(--mut)}
.bold{font-weight:700}
.draft{background:var(--acc2);border-left:4px solid var(--acc);padding:8px 12px;border-radius:6px;margin:0 0 14px}
.warn{background:#f3eee0;border-left:4px solid #8a7a45;padding:8px 12px;border-radius:6px;margin:0 0 14px}
.btn{font:inherit;border:1.5px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;padding:8px 16px;min-height:44px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff}
.btn.danger{border-color:#b42318;color:#b42318}
.btn.danger.p{background:#b42318;color:#fff}
.confirm{flex-basis:100%;border:1.5px solid #b42318;border-radius:10px;background:#fdf1f0;padding:8px 14px}
.confirm p{margin:4px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{font:inherit;color:var(--acc);background:none;border:0;padding:8px 6px;min-height:44px;text-decoration:underline;cursor:pointer}
a{color:var(--acc)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav .links{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chapter{color:var(--mut)}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:8px 14px;background:#fff;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.opt input{width:22px;height:22px;margin-top:4px;flex:none}
.scalewrap{display:grid;gap:8px;margin-top:14px}
.scalewrap .cap{color:var(--mut)}
.scale{display:flex;flex-direction:column-reverse;gap:8px}
.scalewrap .hi{grid-area:hi}.scalewrap .lo{grid-area:lo}.scalewrap .scale{grid-area:grp}
.scalewrap{grid-template-areas:"hi" "grp" "lo"}
.choice{font:inherit;text-align:center;min-height:48px;padding:8px 12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink)}
.choice[aria-checked="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

.choice[aria-checked="true"] kbd{color:#fff}
.skip kbd{position:static;transform:none;margin-left:8px}
@media (hover:none) and (pointer:coarse){.choice kbd{display:none}}
.skip{display:block;width:100%;margin-top:22px;border-style:dashed;color:var(--mut)}
.skip.sel{background:var(--acc2);border-color:var(--acc)}
@media (min-width:640px){

.center{text-align:center}
.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

function model() {
  const R = session.results(), Q = session.quality();
  return { R, Q, all: R.every((r) => [PRECISE, IMPRECISE].includes(profState(r))) && !Q.flagged };
}
function levelOf(r, Q) {
  if (Q.flagged || ![PRECISE, IMPRECISE].includes(profState(r))) return 'pending';
  return r.score >= LEVEL_CUTS.high ? 'high' : r.score >= LEVEL_CUTS.medium ? 'medium' : r.score >= LEVEL_CUTS.low ? 'low' : 'neutral';
}
function levelIcon(level) {
  if (level === 'pending') return '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></svg>';
  const n = { neutral: 0, low: 1, medium: 2, high: 3 }[level];
  const bar = (i) => `<rect x="${3 + i * 6}" y="${15 - i * 4}" width="4" height="${4 + i * 4}" fill="${i < n ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5"/>`;
  return `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">${bar(0)}${bar(1)}${bar(2)}</svg>`;
}
// precision bar: full at the margin limit of the Profile, empty at four times that limit
function clarity(p, r) {
  const L = p.margin_stop ?? CFG.profile_margin_stop;
  return { fill: r.k ? clamp(1 - (r.margin / L - 1) / 3, 0, 1) : 0, step: [3, 2, 1].filter((m) => r.margin <= m * L).length };
}
function scoreBar(c, s, label) {
  const lo = clamp(s.score - (Number.isFinite(s.margin) ? s.margin : 0), -1, 1), hi = clamp(s.score + (Number.isFinite(s.margin) ? s.margin : 0), -1, 1);
  const aria = `${label}: score ${f2(s.score)}, margin ${Number.isFinite(s.margin) ? f2(s.margin) : 'unknown'}, on a scale from -1 to 1`;
  return `<div class="axis" role="img" aria-label="${esc(aria)}">${Number.isFinite(s.margin) ? `<div class="rng" style="left:${(lo + 1) * 50}%;width:${(hi - lo) * 50}%"></div>` : ''}<div class="dot" style="left:${(s.score + 1) * 50}%"></div></div>`;
}
// ---------- screens ----------
function shell(title, right, body) {
  return `<section class="frame">
    <header><span>${esc(title)}</span><span>${right}</span></header>
    <main id="main">${body}</main>
    <footer class="noprint"><span>${canSave ? 'Progress is saved on this device only.' : 'This browser cannot save here: progress will be lost when you close the page.'}</span></footer>
  </section>`;
}

function selectionHtml() {
  return REG.profiles.map((p) => `<label class="opt"><input type="checkbox" data-prof="${p.id}" ${ui.sel.includes(p.id) ? 'checked' : ''}><span><b>${esc(short(p))}</b><br><span class="muted">${esc(p.description)}</span></span></label>`).join('');
}

function renderIntro() {
  const saved = S && S.answers.length;
  const body = `<h1 id="h" data-focus tabindex="-1">Self-reflection questionnaire</h1>
    <div class="draft">This is a draft self-reflection aid, not a diagnosis. The questions and profiles are a draft and have not been scientifically validated.</div>
    <ul class="plain">
      <li>You can skip any question and stop at any time.</li>
      <li>Choosing an answer moves to the next question. “Back” undoes the last one. Keys 1 to 5 choose, S skips.</li>
      <li>Your answers stay in this browser. Nothing is sent over the network.</li>
    </ul>
    ${saved ? `<h3>Continue where you stopped</h3>
      <p>A session with ${plural(saved, 'answer', 'answers')} is saved on this device.</p>
      <div class="row2"><button class="btn p" data-act="continue">Continue</button><button class="btn" data-act="export">Export to a file</button>${eraseControl()}</div>
      <p class="muted">To start a new session, erase the saved one first.</p>`
    : `<h3>Profiles to explore</h3>
      <p class="muted">All are selected by default. The next questions depend on this choice, and you can change it at any moment; answers already given are reused.</p>
      ${selectionHtml()}
      <div class="nav"><span class="msg muted">${ui.sel.length ? '' : 'Choose at least one profile.'}</span><button class="btn p" data-act="start" ${ui.sel.length ? '' : 'disabled'}>Start</button></div>`}
    <p><button class="linkbtn" data-act="import">Import a session file</button><input class="vh" type="file" id="file" accept="application/json,.json" tabindex="-1" aria-hidden="true"></p>
    <p class="msg" role="alert">${esc(ui.msg)}</p>`;
  return shell('Self-reflection questionnaire', 'Start', body);
}

// answers to Questions that touch any Characteristic of the Profile (shared Characteristics included)
const relatedAnswers = (p) => S.answers.filter((a) => engine.qById[a.q].characteristics.some((c) => p.characteristics.includes(c.id)));
function deleteControl(p) {
  const n = relatedAnswers(p).length;
  if (!n) return '';
  return `<hr class="sep noprint"><div class="noprint">${ui.confirmDelete === p.id
    ? `<div class="confirm" role="alert"><p><b>Delete the ${n} answer${n === 1 ? '' : 's'} related to ${esc(short(p))}?</b> All answers to questions that touch this profile's characteristics will be deleted, which might change the current scores of other profiles that share them. This cannot be undone. You can then answer these questions again.</p><div class="row2"><button class="btn danger p" data-act="del-yes" data-id="${p.id}" data-fid="del-yes">Yes, delete answers</button><button class="btn" data-act="del-no" data-fid="del-${p.id}">Cancel</button></div></div>`
    : `<button class="btn danger" data-act="del" data-id="${p.id}" data-fid="del-${p.id}">Delete answers</button>`}</div>`;
}

function eraseControl() {
  return ui.confirmErase
    ? `<div class="confirm" role="alert"><p><b>Erase all answers stored on this device?</b> This cannot be undone.</p><div class="row2"><button class="btn danger p" data-act="erase-yes" data-fid="erase-yes">Yes, erase everything</button><button class="btn" data-act="erase-no" data-fid="erase">Cancel</button></div></div>`
    : '<button class="btn danger" data-act="erase" data-fid="erase">Erase all data</button>';
}

function renderProfiles() {
  const body = `<h1 id="h" data-focus tabindex="-1">Profiles to explore</h1>
    <p class="muted">The next questions change when this selection changes. Answers already given are kept and reused, also when you add a profile again later.</p>
    ${selectionHtml()}
    <div class="nav"><button class="btn" data-act="cancel-profiles">Cancel</button><span class="msg muted">${ui.sel.length ? '' : 'Choose at least one profile.'}</span><button class="btn p" data-act="apply-profiles" ${ui.sel.length ? '' : 'disabled'}>Apply and continue</button></div>
    <h3>Your data</h3>
    <p class="muted">Everything is stored on this device only. Export a copy, load one from a file, or erase it all to start from scratch.</p>
    <div class="row2"><button class="btn" data-act="export">Export to a file</button><button class="btn" data-act="import">Import a session file</button>${eraseControl()}</div>
    <input class="vh" type="file" id="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">
    <p class="msg" role="alert">${esc(ui.msg)}</p>`;
  return shell('Self-reflection questionnaire', `${answeredCount()} answered`, body);
}

function statusNote(q) {
  const n = S.answers.length, ev = trace.events[n - 1] || [];
  if (!n || ui.dismissedAt === n) return '';
  const good = ev.find((e) => e.kind === 'good'), pause = ev.find((e) => e.kind === 'pause'), accs = ev.filter((e) => e.kind === 'a');
  let html = '';
  if (good) html = `${esc(good.text)} You can <button class="linkbtn" data-act="results">see the results</button> or keep answering to refine them.`;
  else if (pause) html = `${esc(pause.text)} A pause is a good idea if you feel like it: your progress is saved. <button class="linkbtn" data-act="results">See results</button>`;
  else if (n === 1) html = 'Answer recorded. Moving to the next question. Use Back to revise.';
  else if (accs.length) html = esc(accs[accs.length - 1].text);
  return html ? `<div class="note"><span>${html}</span><button class="x" type="button" data-act="dismiss" aria-label="Dismiss note">✕</button></div>` : '';
}

function renderQuestion(q) {
  const scale = q.answer === 'frequency' ? FREQ : AGREE, m = model();
  const choices = scale.map(([, t], i) => `<button type="button" class="choice" role="radio" aria-checked="${ui.chosen === i}" tabindex="${i === 0 ? 0 : -1}" data-act="choose" data-i="${i}" aria-keyshortcuts="${i + 1}">${t}<kbd aria-hidden="true">${i + 1}</kbd></button>`).join('');
  const body = `<div class="chapter">Chapter: ${esc(DOMAIN_LABEL[q.domain])}</div>
    <h1 id="h" data-focus tabindex="-1">${esc(q.title)}</h1>
    ${q.details ? `<p class="muted">${esc(q.details)}</p>` : ''}
    <div class="scalewrap">
      <span class="cap lo" aria-hidden="true">Least like me</span>
      <div class="scale" role="radiogroup" aria-labelledby="h">${choices}</div>
      <span class="cap hi" aria-hidden="true">Most like me</span>
    </div>
    <button type="button" class="choice skip ${ui.chosen === 'skip' ? 'sel' : ''}" data-act="skip" aria-keyshortcuts="s">Skip this question<kbd aria-hidden="true">S</kbd></button>
    <div class="status" role="status" aria-live="polite">${statusNote(q)}</div>
    <div class="nav">
      <button class="btn" data-act="back" ${S.answers.length ? '' : 'disabled'}>← Back</button>
      <span class="links"><button class="linkbtn" data-act="profiles">Change profiles</button><button class="linkbtn bold" data-act="results">${m.all ? 'See results' : 'See partial results'}</button></span>
    </div>`;
  return shell('Self-reflection questionnaire', `${progressText()}`, body);
}

function renderEnd() {
  const m = model();
  const body = `<h1 id="h" data-focus tabindex="-1">No more questions</h1>
    <p>The selected profiles have no further questions to ask. You can see your results, or add a profile to explore more.</p>
    <div class="nav"><button class="btn" data-act="back" ${S.answers.length ? '' : 'disabled'}>← Back</button><span class="links"><button class="linkbtn" data-act="profiles">Change profiles</button><button class="btn p" data-act="results">${m.all ? 'See results' : 'See partial results'}</button></span></div>`;
  return shell('Self-reflection questionnaire', `${progressText()}`, body);
}

function infoBox(key, c) {
  if (!ui.info[key]) return '';
  return `<div class="more" id="info-${key}"><p>${esc(c.userInfo || c.description)}</p>
    <p class="muted">This is a draft description, not a validated definition.</p>
    ${c.userUrl ? `<p><a href="${esc(c.userUrl)}" target="_blank" rel="noopener noreferrer">Know more ↗</a> <span class="muted">(opens an external site)</span></p>` : ''}</div>`;
}
function infoButton(key, c) {
  return `<button type="button" class="ib" data-act="info" data-id="${key}" data-fid="info-${key}" aria-expanded="${!!ui.info[key]}" aria-controls="info-${key}" aria-label="About ${esc(c.name)}"><span aria-hidden="true">i</span></button>`;
}
function crowHtml(key, c, s) {
  const hm = isHighMargin(s);
  return `<div class="crow ${hm ? 'hm' : ''}"><span class="cname">${infoButton(key, c)}<span>${esc(c.name)}</span></span>${scoreBar(c, s, c.name)}<span>${fmt(s.score, s.margin)} · ${rowState(s)}</span></div>`;
}
function charRow(key, c, s) {
  if (s.score === null) return `<div class="crow"><span class="cname">${infoButton(key, c)}<span>${esc(c.name)}</span></span><span class="muted">not evaluated yet</span><span></span></div>${infoBox(key, c)}`;
  return `${crowHtml(key, c, s)}${infoBox(key, c)}`;
}

function profileDetails(p, r) {
  const c = clarity(p, r), T = p.characteristics.length;
  const list = p.characteristics.map((id) => ({ c: chById[id], s: session.st[id] })).sort((a, b) => (b.s.score ?? -9) - (a.s.score ?? -9));
  return `<div class="plist" id="det-${p.id}">
    <div class="pb" role="img" aria-label="Precision step ${c.step} of 3 for ${esc(short(p))}"><b style="width:${Math.round(c.fill * 100)}%"></b></div>
    <div class="center">${r.k} of ${T} characteristics evaluated</div>
    <hr class="sep">
    <h4>Characteristics</h4>
    ${list.map(({ c: ch, s }) => charRow(`${p.id}:${ch.id}`, ch, s)).join('')}
    ${deleteControl(p)}
  </div>`;
}

function renderResults() {
  const m = model();
  const open = (id) => ui.printAll || ui.expanded[id];
  const rows = session.analysed.map((p, i) => {
    const r = m.R[i], lv = levelOf(r, m.Q), st = profState(r), isOpen = open(p.id), gray = st === IMPRECISE ? ' hm' : '';
    return `<div class="card"><button type="button" class="prow" data-act="expand" data-id="${p.id}" data-fid="prof-${p.id}" aria-expanded="${!!isOpen}" aria-controls="det-${p.id}">
        <span class="pname"><span class="lvl${gray}" role="img"aria-label="Characteristics of this profile: ${lv}" title="${lv === 'pending' ? 'The level is shown once the profile is well explored.' : ''}">${levelIcon(lv)}</span><span><b>${esc(short(p))}</b><br><span class="muted">level ${lv}</span></span></span>
        <span><span class="lbl">Score</span>${r.k ? `<span class="pscore${gray}">${scoreBar({}, { score: r.score, margin: r.margin }, `${short(p)} score`)}<span>${fmt(r.score, r.margin)}</span></span>` : '—'}</span>
        <span><span class="lbl">Weighted score</span>${r.k ? f2(r.wscore) : '—'}</span>
        <span><span class="tag">${st}</span></span></button>
      ${isOpen ? profileDetails(p, r) : ''}</div>`;
  }).join('');

  // by domain, collapsed by default
  const withScore = REG.characteristics.filter((c) => session.st[c.id].score !== null);
  let domainBody = '';
  if (ui.sections.domain || ui.printAll) {
    const doms = Object.keys(DOMAIN_LABEL).map((d) => {
      const items = withScore.filter((c) => c.domain === d).sort((a, b) => session.st[b.id].score - session.st[a.id].score);
      const [res] = engine.profileResults(session.st, [{ id: d, characteristics: items.map((c) => c.id) }]);
      return { d, items, res };
    }).filter((x) => x.items.length).sort((a, b) => b.res.score - a.res.score);
    domainBody = doms.map(({ d, items, res }) => `<h4 class="dh"><span>${esc(DOMAIN_LABEL[d])}</span><span>${fmt(res.score, res.margin)}</span></h4>${items.map((c) => {
      const key = `dom:${c.id}`;
      return `${crowHtml(key, c, session.st[c.id])}${infoBox(key, c)}`;
    }).join('')}`).join('');
  }

  // progress, collapsed by default
  let progressBody = '';
  if (ui.sections.progress || ui.printAll) {
    const s = trace.snaps, last = s[s.length - 1], before = s[s.length - 2];
    const effect = !before ? '<p class="muted">This comparison appears after 20 answered questions.</p>' : `<ul class="plain">${session.analysed.map((p) => {
      const x = before.margins[p.id], y = last.margins[p.id];
      if (!Number.isFinite(x) || !Number.isFinite(y)) return `<li>${esc(short(p))}: not enough answers to compare yet.</li>`;
      const verb = f2(y) === f2(x) ? 'did not change' : y < x ? 'narrowed' : 'moved';
      return `<li>${esc(short(p))}: from answer ${before.n} to ${last.n} the margin ${verb === 'did not change' ? `${verb} (${f2(x)})` : `${verb} from ${f2(x)} to ${f2(y)}`}.</li>`;
    }).join('')}</ul>`;
    const acc = trace.events.flatMap((ev, i) => ev.filter((e) => e.kind !== 'pause').map((e) => `<li>After question ${i + 1}: ${esc(e.text)}</li>`));
    progressBody = `<h4>How clear the picture is, per profile</h4>
      ${session.analysed.map((p, i) => { const c = clarity(p, m.R[i]); return `<div class="crow"><span>${esc(short(p))}</span><div class="pb" style="margin:0;max-width:none" role="img" aria-label="Precision step ${c.step} of 3 for ${esc(short(p))}"><b style="width:${Math.round(c.fill * 100)}%"></b></div><span class="tag">${profState(m.R[i])}</span></div>`; }).join('')}
      <h4>Effect of the latest answers</h4>${effect}
      <h4>Accomplishments</h4>${acc.length ? `<ul class="plain">${acc.join('')}</ul>` : '<p class="muted">None yet.</p>'}`;
  }

  const section = (id, title, summary, body) => `<div class="sec"><button type="button" data-act="section" data-id="${id}" data-fid="sec-${id}" aria-expanded="${!!(ui.sections[id] || ui.printAll)}" aria-controls="sec-${id}"><b>${title}</b> <span class="muted">· ${summary}</span></button>${body ? `<div class="body" id="sec-${id}">${body}</div>` : ''}</div>`;

  const body = `<p class="noprint"><button class="linkbtn" data-act="keep">← Back to answering</button></p>
    <h1 id="h" data-focus tabindex="-1">${m.all ? 'Your results' : 'Your results so far'}</h1>
    <div class="draft">Your answers suggest the patterns below. This is a draft self-reflection aid, not a validated instrument and not a diagnosis. The margins describe answer noise only, not validity.</div>
    ${m.Q.flagged ? '<div class="warn" role="note">Some of your answers look inconsistent with each other, so the scores may not describe you well. Answering again more carefully may help. This is only a consistency check, not a judgement.</div>' : ''}
    <p>Profiles being analysed: ${session.analysed.map((p) => esc(short(p))).join(', ')}. <button class="linkbtn noprint" data-act="profiles">Change profiles</button></p>
    <h2>Profiles</h2>
    <div class="phead" aria-hidden="true"><span>Profile</span><span>Score</span><span>Weighted score</span><span>State</span></div>
    ${rows}
    ${m.R.some((r) => profState(r) === IMPRECISE) ? '<p class="muted" role="note"><b>Imprecise</b>: the questions are finished, but your answers may conflict. Answering again more carefully may help.</p>' : ''}    <p class="muted"><b>Weighted</b> score gives more weight to characteristics that fewer profiles share.</p>
    ${section('domain', 'Characteristics by domain', `${plural(withScore.length, 'characteristic', 'characteristics')} with a score`, domainBody)}
    ${section('progress', 'Progress', 'clarity, effect, accomplishments', progressBody)}
    <p class="muted">You can print or save these results to talk about them with a professional. They describe characteristics, not a diagnosis.</p>
    <div class="nav noprint">
      <span class="links"><button class="btn ${m.all ? '' : 'p'}" data-act="keep">← Keep answering</button><button class="btn ${m.all ? 'p' : ''}" data-act="print">Print / save as PDF</button><button class="btn" data-act="export">Export session</button></span>
      <button class="linkbtn" data-act="profiles">Change profiles</button>
    </div>`;
  return shell('Your results', `${progressText()}${m.all ? '' : ' · keep answering to improve confidence'}`, body);
}

// ---------- rendering and actions ----------
function render() {
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  let html;
  if (ui.view === 'intro') html = renderIntro();
  else if (ui.view === 'profiles') html = renderProfiles();
  else if (ui.view === 'results') html = renderResults();
  else { const q = session.next(); html = q ? renderQuestion(q) : renderEnd(); }
  $('#app').innerHTML = html;
  const target = ui.focusMain ? $('[data-focus]') : keep ? $(`[data-fid="${keep}"]`) : null;
  ui.focusMain = false;
  if (target) target.focus();
}
function go(view) { ui.view = view; ui.confirmErase = false; ui.confirmDelete = null; ui.focusMain = true; ui.msg = ''; render(); window.scrollTo(0, 0); }
const resume = () => (ui.view = 'question');

function start() {
  if (!ui.sel.length) return;
  S = { profiles: allIds.filter((id) => ui.sel.includes(id)), answers: [], changes: [] };
  persist(); rebuild(); ui.dismissedAt = -1; go('question');
}
function commit(value) {
  const q = session.next();
  S.answers.push({ q: q.id, v: value });
  persist(); rebuild();
  ui.locked = false; ui.chosen = null; ui.dismissedAt = -1; ui.focusMain = true;
  render();
}
function choose(i) {
  if (ui.locked || ui.view !== 'question') return;
  const q = session.next(); if (!q) return;
  const scale = q.answer === 'frequency' ? FREQ : AGREE, skip = i === 'skip';
  ui.locked = true; ui.chosen = i;
  document.querySelectorAll('.choice[role="radio"]').forEach((b, k) => b.setAttribute('aria-checked', String(k === i)));
  if (skip) $('.skip').classList.add('sel');
  setTimeout(() => commit(skip ? null : scale[i][0]), ADVANCE_MS);
}
function back() {
  if (!S || !S.answers.length) return;
  S.answers.pop();
  S.changes.forEach((c) => { c.at = Math.min(c.at, S.answers.length); });
  persist(); rebuild(); ui.dismissedAt = -1;
  go(session.next() ? 'question' : 'end');
}
function deleteAnswers(id) {
  const drop = new Set(relatedAnswers(profById[id]));
  const keptBefore = (n) => S.answers.slice(0, n).filter((a) => !drop.has(a)).length;
  S.changes.forEach((c) => { c.at = keptBefore(c.at); });
  S.answers = S.answers.filter((a) => !drop.has(a));
  ui.confirmDelete = null; ui.dismissedAt = -1;
  persist(); rebuild();
  go(session.next() ? 'question' : 'end');
}
function applyProfiles() {
  const next = allIds.filter((id) => ui.sel.includes(id));
  if (next.join() !== session.profiles.join()) {
    S.changes.push({ at: S.answers.length, profiles: next });
    persist(); rebuild();
  }
  go(ui.returnTo === 'results' ? 'results' : session.next() ? 'question' : 'end');
}
function exportSession() {
  const blob = new Blob([JSON.stringify({ app: 'exercise-questionnaire', version: 1, ...S }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'questionnaire-session.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function eraseAll() {
  ui.confirmErase = false;
  dropStore(KEY); S = null; session = null; trace = { events: [], snaps: [] };
  ui.sel = allIds.slice(); ui.expanded = {}; ui.info = {}; ui.msg = 'All stored data was erased.';
  ui.view = 'intro'; ui.focusMain = true; render();
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = parseSession(JSON.parse(String(reader.result)));
      if (S && S.answers.length && !window.confirm('Replace the session saved on this device with the imported one?')) return;
      S = next; persist(); rebuild(); ui.dismissedAt = -1;
      go(session.next() ? 'question' : 'end');
    } catch (e) { ui.msg = `The file could not be imported: ${e.message}.`; render(); }
  };
  reader.onerror = () => { ui.msg = 'The file could not be read.'; render(); };
  reader.readAsText(file);
}

const actions = {
  start, back, 'apply-profiles': applyProfiles, export: exportSession, erase: () => { ui.confirmErase = true; render(); }, 'erase-yes': eraseAll, 'erase-no': () => { ui.confirmErase = false; render(); },
  del: (el) => { ui.confirmDelete = el.dataset.id; render(); }, 'del-yes': (el) => deleteAnswers(el.dataset.id), 'del-no': () => { ui.confirmDelete = null; render(); },
  continue: () => { rebuild(); go(session.next() ? 'question' : 'end'); },
  choose: (el) => choose(+el.dataset.i),
  skip: () => choose('skip'),
  profiles: () => { ui.returnTo = ui.view === 'results' ? 'results' : 'question'; ui.sel = session.profiles.slice(); go('profiles'); },
  'cancel-profiles': () => go(ui.returnTo === 'results' ? 'results' : session.next() ? 'question' : 'end'),
  results: () => go('results'),
  keep: () => go(session.next() ? 'question' : 'end'),
  print: () => window.print(),
  dismiss: () => { ui.dismissedAt = S.answers.length; const n = $('.note'); if (n) n.remove(); const h = $('[data-focus]'); if (h) h.focus(); },
  expand: (el) => { ui.expanded[el.dataset.id] = !ui.expanded[el.dataset.id]; render(); },
  info: (el) => { ui.info[el.dataset.id] = !ui.info[el.dataset.id]; render(); },
  section: (el) => { ui.sections[el.dataset.id] = !ui.sections[el.dataset.id]; render(); },
  import: () => $('#file').click()
};

const app = $('#app');
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});
app.addEventListener('change', (e) => {
  if (e.target.matches('input[data-prof]')) {
    const id = e.target.dataset.prof;
    ui.sel = e.target.checked ? ui.sel.concat(id) : ui.sel.filter((x) => x !== id);
    const ok = ui.sel.length > 0;
    const b = $('[data-act="start"]') || $('[data-act="apply-profiles"]'); if (b) b.disabled = !ok;
    const m = $('.msg.muted'); if (m) m.textContent = ok ? '' : 'Choose at least one profile.';
  } else if (e.target.id === 'file' && e.target.files[0]) importFile(e.target.files[0]);
});
// arrow keys only move the focus: up or right is a higher choice (exercise-bdr-policy-606.03-answer-input)
app.addEventListener('keydown', (e) => {
  const g = e.target.closest && e.target.closest('[role="radiogroup"]');
  if (!g) return;
  const radios = [...g.querySelectorAll('[role="radio"]')], i = radios.indexOf(document.activeElement);
  const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
  if (i < 0 || !step) return;
  e.preventDefault();
  const n = radios[clamp(i + step, 0, radios.length - 1)];
  radios.forEach((r) => { r.tabIndex = -1; }); n.tabIndex = 0; n.focus();
});
document.addEventListener('keydown', (e) => {
  if (ui.view !== 'question' || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (/^[1-5]$/.test(e.key)) choose(+e.key - 1);
  else if (e.key === 's' || e.key === 'S') choose('skip');
});
window.addEventListener('beforeprint', () => { if (ui.view === 'results') { ui.printAll = true; render(); } });
window.addEventListener('afterprint', () => { if (ui.printAll) { ui.printAll = false; render(); } });

// ---------- boot ----------
(function boot() {
  const stored = readStore(KEY);
  if (stored) {
    try { S = parseSession(stored); rebuild(); } catch (e) { dropStore(KEY); S = null; ui.msg = `The saved session could not be restored (${e.message}) and was removed.`; }
  }
  ui.view = 'intro'; render();
}());
}());
</script>
</body>
</html>
